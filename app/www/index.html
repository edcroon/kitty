.hero .big .num{font:inherit;letter-spacing:inherit;font-variant-numeric:inherit;display:inline;margin:0}
.hero .big{white-space:nowrap}.hero .big.sm{white-space:normal}
:root{--brand:#5C8DFF;--r:10px;--num:'Kitty Num','Inter Tight',system-ui,sans-serif}

:root{--bg:#F7F6F3;--ink:#111111;--muted:#6B6862;--line:#E1DDD6;--pos:#1F4FD1;--neg:#B4430F;--warn:#B4430F;--mono:'IBM Plex Mono',ui-monospace,Menlo,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;overflow-x:hidden;overscroll-behavior:none;touch-action:pan-y;-webkit-text-size-adjust:100%;max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:'Inter Tight','Inter',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;font-size:16px}
button{font-family:inherit;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--pos);outline-offset:2px}
.num{font-family:var(--num);font-weight:600;font-variant-numeric:tabular-nums lining-nums;letter-spacing:-.01em}
.ink{color:var(--ink)}
#app{box-sizing:border-box;max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;padding:calc(env(safe-area-inset-top) + 20px) 24px calc(env(safe-area-inset-bottom) + 112px)}
.stack{display:flex;flex-direction:column;gap:18px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 -10px 0 0}
.top .r{display:flex}
.brand{display:flex;align-items:center;gap:10px;margin-left:-4px}.brand .wm{display:block;margin-top:-2px}
.round{width:44px;height:44px;border:none;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;flex-shrink:0}
.back{margin-left:-12px}
.muted{color:var(--muted)}
.lab{font-size:14px;color:var(--muted)}
.hero{display:flex;flex-direction:column;gap:6px;padding:30px 0 14px}
.hero .big{font-family:var(--num);font-size:56px;font-weight:600;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums lining-nums}
.hero .big.sm{font-size:28px}
.hero .sub{font-size:14px;color:var(--muted)}.hero .curnote{font-size:12px;color:var(--muted);margin-top:-2px;align-self:flex-start;cursor:pointer}.hero .big[data-a]{cursor:pointer;-webkit-tap-highlight-color:transparent}
.sec{font-size:13px;color:var(--muted);padding:10px 0 2px}
.rows{display:flex;flex-direction:column}
.grow-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px;align-items:baseline;padding:14px 0;border:none;border-bottom:none;background:none;text-align:left;width:100%;cursor:pointer;font:inherit;color:inherit}
.grow-row .n{font-size:16px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grow-row .v{font-family:var(--num);font-weight:600;font-size:16px;white-space:nowrap}
.grow-row .s{font-size:12px;color:var(--muted)}
.grow-row .s.r{text-align:right}
.pos{color:var(--pos)}.neg{color:var(--neg)}.zero{color:var(--muted)}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:12px 24px calc(env(safe-area-inset-bottom) + 14px);background:var(--bg);border-top:1px solid var(--line);z-index:10}
.dock .in{max-width:432px;margin:0 auto;display:flex;gap:10px}
.btn{flex-shrink:0;height:52px;border-radius:var(--r);border:1px solid var(--ink);font-size:15px;font-weight:500;cursor:pointer;padding:0 18px;background:transparent;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn.primary,.btn.dark{background:var(--brand);border-color:var(--brand);color:#fff}

function initial(g,mid){ const m=mem(g,mid); return esc(((m&&m.name)||'?').trim().charAt(0).toUpperCase()); }

function calcGroup(g){
  const ex=S.exp[g.id]||[], pays=S.pay[g.id]||[], bal={}, share={}, paid={};
  (g.members||[]).forEach(m=>bal[m.id]=0);
  let spent=0;
  ex.forEach(x=>{ const b=x.base||0; spent+=b; bal[x.paidBy]=(bal[x.paidBy]||0)+b; paid[x.paidBy]=(paid[x.paidBy]||0)+b; Object.keys(x.shares||{}).forEach(m=>{ bal[m]=(bal[m]||0)-x.shares[m]; share[m]=(share[m]||0)+x.shares[m]; }); });
  pays.forEach(p=>{ bal[p.from]=(bal[p.from]||0)+p.amount; bal[p.to]=(bal[p.to]||0)-p.amount; });

function syncSubs(){

function homeCur(g){
  const EURO='IE FR DE ES IT PT NL BE AT FI GR LU SK SI EE LV LT MT CY HR'.split(' ');
  const R={GB:'GBP',UK:'GBP',US:'USD',CA:'CAD',AU:'AUD',NZ:'NZD',CH:'CHF',SE:'SEK',NO:'NOK',DK:'DKK',IS:'ISK',PL:'PLN',CZ:'CZK',HU:'HUF',TR:'TRY',AE:'AED',MA:'MAD',ZA:'ZAR',TH:'THB',JP:'JPY',SG:'SGD',HK:'HKD',MX:'MXN'};
  const tags=[]; try{ tags.push(Intl.DateTimeFormat().resolvedOptions().locale); }catch(e){} (navigator.languages||[navigator.language]).forEach(l=>tags.push(l));
  for(const t of tags){ let reg=''; try{ reg=new Intl.Locale(t).region||''; }catch(e){ reg=(String(t||'').split('-')[1]||''); } reg=reg.toUpperCase();
    if(EURO.includes(reg)) return 'EUR'; if(R[reg]) return R[reg]; }

async function saveGroup(){
  if(S.form&&!S.form.id&&S.form.step!==2){ gNext(); return; }
  memCommit(false);
  const f=S.form, err=document.getElementById('g-err');
  const name=(f.name||'').trim();
  if(!name){ err.textContent='Give it a name.'; return; }
  const members=f.members.map(m=>Object.assign({},m,{name:(m.name||'').trim()})).filter(m=>m.name||m.uid);
  members.forEach(m=>{ if(!m.name) m.name='Me'; });
  if(!members.length){ err.textContent='Add at least one person.'; return; }
  const clean=members.map(m=>{ const o={id:m.id,name:m.name.slice(0,30),uid:m.uid||null}; if(m.pay) o.pay=String(m.pay).slice(0,300); return o; });
  if(f.startDate&&!f.endDate) f.endDate=f.startDate;
  if(f.startDate&&f.endDate&&f.endDate<f.startDate){ err.textContent='The trip has to end after it starts.'; return; }
  const body={name:name.slice(0,60),colour:f.colour,currency:f.currency,budget:0,startDate:f.startDate||'',endDate:f.endDate||'',members:clean,touchedAt:Date.now()};
  if(!f.id){
    const id=rid('k');
    body.createdAt=Date.now(); body.createdBy=S.uid||null; body.rates={};
    if(!clean.some(m=>m.uid===S.uid) && S.uid){ clean[0].uid=S.uid; }
    // go straight in - the save carries on in the background, and only brings you back if it fails
    S.groups[id]=Object.assign({id},JSON.parse(JSON.stringify(body))); (S.pendingG=S.pendingG||{})[id]=S.groups[id]; S.exp[id]=[]; S.pay[id]=[];
    closeSheet(); requestAnimationFrame(()=>go(id)); toast('Group started',true);
    const ok=await write(()=>S.db.doc('groups/'+id).set(body));
    if(S.pendingG) delete S.pendingG[id];
    if(!ok){ delete S.groups[id]; if(S.gid===id) go(null); }
  } else {
    const g=G(f.id), hasMoney=(S.exp[f.id]||[]).length>0||(S.pay[f.id]||[]).length>0;
    if(g && f.currency!==g.currency && hasMoney){
      const r=calc(f.convRate);
      if(!(r>0)){ err.textContent='Add the exchange rate to convert this group.'; return; }
      err.textContent='Converting...';
      const ok=await convertGroup(g,f.currency,r,body);
      if(ok){ if(S.form===f) closeSheet(); toast('Switched to '+f.currency); } else if(S.form===f) err.textContent='Some of it didn\'t convert - try again.';
      return;
    }
    if(S.groups[f.id]) S.groups[f.id]=Object.assign({},S.groups[f.id],JSON.parse(JSON.stringify(body)));
    closeSheet(); toast('Saved'); render();
    write(()=>S.db.doc('groups/'+f.id).update(body));
  }
}
async function convertGroup(g,cur,r,body){
  const from=g.currency, base='groups/'+g.id;
  for(const x of (S.exp[g.id]||[])){
    const y=Object.assign({},x); delete y.id;
    let nb, nr;
    if(x.currency===cur){ nb=x.amount; nr=1; }
    else if(x.currency===from){ nb=Math.round(x.amount*r); nr=r; }
    else { nr=(x.rate||1)*r; nb=Math.round(x.amount*nr); }
    const ids=Object.keys(x.shares||{});
    const parts=allocate(nb,ids.map(id=>x.shares[id]));
    const shares={}; ids.forEach((id,i)=>shares[id]=parts[i]);
    y.base=nb; y.rate=nr; y.shares=shares; y.exact=Object.assign({},x.exact||{}); y.weights=Object.assign({},x.weights||{}); y.notMine=Object.assign({},x.notMine||{}); y.updatedAt=Date.now();
    if(!(await write(()=>S.db.doc(base+'/expenses/'+x.id).set(y)))) return false;
  }
  for(const p of (S.pay[g.id]||[])){
    const y=Object.assign({},p); delete y.id; y.amount=Math.round(p.amount*r);
    if(!(await write(()=>S.db.doc(base+'/payments/'+p.id).set(y)))) return false;
  }
  const rates={}; Object.keys(g.rates||{}).forEach(k=>{ if(k!==cur) rates[k]=+(g.rates[k]*r).toFixed(6); }); rates[from]=+r.toFixed(6);
  const full=Object.assign({},g); delete full.id;
  Object.assign(full,body,{currency:cur,rates});
  return write(()=>S.db.doc(base).set(full));
}
async function deleteGroup(gid){
  const ex=S.exp[gid]||[], ps=S.pay[gid]||[];
  await new Promise(r=>setTimeout(r,180)); await fadeRow('g:'+gid);
  // gone straight away on screen; the removal carries on in the background and never touches what you've opened since
  S.gone[gid]=true;
  if(S.gid===gid) go(null); else render();
  toast('Group deleted');
  for(const x of ex){ await write(()=>S.db.doc('groups/'+gid+'/expenses/'+x.id).delete()); if(x.photoId) dropPhoto(x.photoId); }
  for(const p of ps){ await write(()=>S.db.doc('groups/'+gid+'/payments/'+p.id).delete()); }
  const ok=await write(()=>S.db.doc('groups/'+gid).delete());
  if(!ok){ delete S.gone[gid]; render(); toast("Couldn't delete the group - try again"); }
}

// Live exchange rates: European Central Bank rates via frankfurter.dev, with open.er-api.com as a backup. Kept on the phone for 6 hours.
const RATE_KEY='kitty-rates';
async function liveRate(from,to){
  if(from===to) return {rate:1};
  let cache={}; try{ cache=JSON.parse(localStorage.getItem(RATE_KEY)||'{}'); }catch(e){}
  const k=from+'>'+to, c=cache[k]; if(c&&Date.now()-c.at<6*3600e3) return c;
  const get=async url=>{ const ctl=new AbortController(), tm=setTimeout(()=>ctl.abort(),5000); try{ const r=await fetch(url,{signal:ctl.signal}); return await r.json(); } finally{ clearTimeout(tm); } };
  const tries=[

function computeShares(f,g){
  const v=calc(f.amountStr); const total=(v>0)?Math.round(v*100):0;
  const ids=(g.members||[]).map(m=>m.id).filter(id=>f.inc[id]);
  let parts;
  if(f.mode==='equal') parts=allocate(total,ids.map(()=>1));
  else if(f.mode==='shares') parts=allocate(total,ids.map(id=>Math.max(0,Number(f.shares[id])||0)));
  else parts=ids.map(id=>{ const x=calc(f.exact[id]); return x>0?Math.round(x*100):0; });
  const foreign=f.currency!==g.currency;
  const rate=foreign?calc(f.rate):1;
  const base=(rate>0)?Math.round(total*rate):0;
  const baseParts=foreign?allocate(base,parts):parts;
  return {total,ids,parts,rate,base,baseParts,sum:parts.reduce((a,b)=>a+b,0),foreign};
}

const LP={db:null,urls:{}};

})();
setInterval(()=>{ const cs=[...document.querySelectorAll('.catbtn:not(.pet):not(.charging):not(.asleep):not(.sulk)')]; if(!cs.length||document.hidden) return; const c=cs[Math.floor(Math.random()*cs.length)]; c.classList.add('blink'); setTimeout(()=>c.classList.remove('blink'),260); },4200);
function party(g,home){
  const el=document.createElement('div'); el.id='party'; el._home=!!home; el.setAttribute('data-a','partyClose'); el.setAttribute('role','status');
  let bits=''; for(let i=0;i<40;i++){ const z=8+Math.random()*14; bits+='<b class="coin" style="left:'+(Math.random()*100)+'%;width:'+z+'px;height:'+z+'px;animation-delay:'+(Math.random()*1.2).toFixed(2)+'s;animation-duration:'+(1.1+Math.random()*1.1).toFixed(2)+'s"></b>'; }
  el.innerHTML=bits+cat(140)+'<div class="big">All square!</div><div class="sub">'+esc(g.name)+' is settled up</div>';
  document.body.appendChild(el); clearTimeout(party._t); party._t=setTimeout(endParty,3200);
}
function endParty(){ const el=document.getElementById('party'); if(!el||el._going) return; el._going=1; el.style.pointerEvents='none';
  if(el._home&&S.view==='group') go(null); // all square: back to your groups, appearing as the party fades 
  const a=el.animate([{opacity:1},{opacity:0}],{duration:260,easing:'ease-out',fill:'forwards'}); a.onfinish=()=>el.remove(); setTimeout(()=>el.remove(),500); }
async function addPayment(g,from,to,amount,stay){
  const c=calcGroup(g), bal=Object.assign({},c.bal); bal[from]=(bal[from]||0)+amount; bal[to]=(bal[to]||0)-amount;
  const square=Object.values(bal).every(v=>Math.abs(v)<=2) && (S.exp[g.id]||[]).length>0;
  const pid=rid('p');
  const pbody={from,to,amount,date:today(),at:Date.now(),by:S.uid||null}; localPut('groups/'+g.id+'/payments/'+pid,pbody);
  const saving=write(()=>S.db.doc('groups/'+g.id+'/payments/'+pid).set(pbody));
  saving.then(ok=>{ if(!ok){ localPut('groups/'+g.id+'/payments/'+pid,null); render(); if(S.sheet&&S.sheet.kind==='settle') renderSheet(); } });
  { if(stay&&!square){ toast(mName(g,from)+' paid '+mName(g,to)+' '+fmt(amount,g.currency),true); if(S.sheet&&S.sheet.kind==='settle') renderSheet(); } else { closeSheet(); if(square) setTimeout(()=>party(g,true),250); else toast('Settled',true); } saving.then(ok=>{ if(ok) write(()=>S.db.doc('groups/'+g.id).update({touchedAt:Date.now()})); }); }
}
function searchResults(q){
  const n=norm(q); if(!n) return [];
  const out=[];
  myGroups().forEach(g=>{ (S.exp[g.id]||[]).forEach(x=>{ const hay=norm([x.desc,x.note,catLabel(x),mName(g,x.paidBy,false),g.name].join(' ')); if(n.split(' ').every(w=>hay.includes(w))) out.push({g,x}); }); });
  return out.sort((a,b)=>(b.x.date||'').localeCompare(a.x.date||'')).slice(0,60);
}
function searchList(q){
  const r=searchResults(q);
  if(!norm(q)) return '<div class="hint" style="text-align:center;padding:12px">Search by what it was, who paid, the type or the group.</div>';
  if(!r.length) return '<div class="hint" style="text-align:center;padding:12px">Nothing matches "'+esc(q)+'"</div>';
  const tot=r.reduce((a,{x})=>a+(x.base||0),0), cur=r[0].g.currency, one=r.every(({g})=>g.currency===cur);
  return '<div class="hint">'+r.length+' found'+(one?' · '+fmt(tot,cur)+' in total':'')+'</div><div class="list">'+r.map(({g,x})=>'<button class="item" data-a="srOpen" data-g="'+esc(g.id)+'" data-e="'+esc(x.id)+'"><span class="l1"><b>'+esc(x.desc)+'</b><i aria-hidden="true"></i><span class="num">'+fmt(x.base,g.currency)+'</span></span><span class="l2"><span class="g">'+esc(g.name)+'</span> · '+esc(dLong(x.date))+'</span></button>').join('')+'</div>';
}
function sheetSearch(){
  return head('Search')+'<div class="f"><label class="sr" for="s-q">Search</label><input class="inp" id="s-q" data-search="1" placeholder="e.g. taxi, Sam, dinner" value="'+esc(S.sheet.data.q||'')+'" data-autofocus autocomplete="off"></div><div class="srch" id="s-res">'+searchList(S.sheet.data.q||'')+'</div>';
}
function sheetPayInfo(){
  const g=G(S.gid), m=mem(g,S.sheet.data.mid)||{};
  return head(m.name+"'s details")+'<div class="link" id="pi-text" style="font-size:16px;white-space:pre-wrap">'+esc(m.pay||'')+'</div><button class="btn dark" data-a="copyPay">Copy</button>';
}
async function copyText(t){ try{ await navigator.clipboard.writeText(t); toast('Copied'); }catch(e){ toast('Press and hold the text to copy it'); } }

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]'); if(!t) return;
  const a=t.dataset.a;
  if((a==='exp'||a==='open') && Date.now()-swipeBlock<400) return;
  if(a==='ovClose'){ if(e.target===t) closeSheet(); return; }
  if(a==='calBack'){ if(e.target===t) calClose(); return; }
  const g=S.gid?G(S.gid):null;
  switch(a){
    case 'close': closeSheet(); break;
    case 'swDel': swDelete(t.closest('.swipe')); break;
    case 'home': go(null); break;
    case 'open': go(t.dataset.g); break;
    case 'settleSheet': case 'settleTab': S.settleAsk=null; openSheet('settle'); break;
    case 'spendSheet': openSheet('spend'); break;
    case 'flipCur': flipCur(); break;
    case 'flipHomeCur': flipHomeCur(); break;
    case 'newGroup': newGroupForm(); break;
    case 'settings': if(g) editGroupForm(g); break;
    case 'invite': openSheet('invite'); break;
    case 'join': openSheet('join'); break;
    case 'joinAs': joinAs(t.dataset.m); break;
    case 'joinNew': joinAs(null,document.getElementById('j-name').value); break;
    case 'addAny': { const mine=myGroups(); if(!mine.length) newGroupForm(); else if(mine.length===1) newExpenseForm(mine[0].id); else openSheet('pick'); break; }
    case 'pickG': newExpenseForm(t.dataset.g); break;
    case 'addExp': if(g){ if(!myMid(g)){ openSheet('join'); } else newExpenseForm(g.id); } break;
    case 'gColour': S.form.colour=t.dataset.c; renderSheet(); break;
    case 'gNext': gNext(); break;
    case 'gBack': memCommit(false); S.form.step=1; S.form.adding=false; S.form.stepAnim='back'; S.sheet.focused=false; renderSheet(); break;
    case 'mAdd': memCommit(true); renderSheet(); focusNew(); break;
    case 'mEdit': { memCommit(false); const i=Number(t.dataset.i); S.form.editIdx=i; S.form.newName=S.form.members[i].name==='Me'?'':S.form.members[i].name||''; renderSheet(); focusNew(); const n=document.getElementById('m-new'); if(n) n.select(); break; }
    case 'mDel': { const i=Number(t.dataset.i); S.form.members.splice(i,1); if(S.form.editIdx===i) { S.form.editIdx=null; S.form.newName=''; } else if(S.form.editIdx>i) S.form.editIdx--; renderSheet(); break; }
    case 'showPay': S.form.showPay=true; renderSheet(); { const x=document.getElementById('g-pay'); if(x) x.focus(); } break;
    case 'saveGroup': saveGroup(); break;
    case 'delGroup': { const gid=S.form.id; confirmBox('Delete this group?','All its expenses and payments go too. This can\'t be undone.','Delete',()=>deleteGroup(gid)); break; }
    case 'payer': S.form.touchedSplit=true; S.form.paidBy=t.dataset.m; renderSheet(); break;
    case 'mode': S.form.touchedSplit=true; S.form.mode=t.dataset.m; renderSheet(); break;
    case 'inc': S.form.touchedSplit=true; S.form.inc[t.dataset.m]=!S.form.inc[t.dataset.m]; renderSheet(); break;
    case 'shr': { S.form.touchedSplit=true; const m=t.dataset.m; S.form.shares[m]=Math.max(0,(Number(S.form.shares[m])||0)+Number(t.dataset.d)); renderSheet(); break; }
    case 'cat': { const f=S.form; if(t.dataset.c==='meal'&&f.cat!=='meal'){ const e=effCat(f); f.meal=e.cat==='meal'?e.meal:'other'; } f.cat=t.dataset.c; sheetFlip(()=>{ document.getElementById('catBox').innerHTML=catChips(f); refreshSentence(); }); break; }
    case 'meal': { const f=S.form; f.cat='meal'; f.meal=t.dataset.c; sheetFlip(()=>{ document.getElementById('catBox').innerHTML=catChips(f); refreshSentence(); }); break; }
    case 'rmPhoto': S.form.photoId=null; renderSheet(); break;
    case 'saveExp': saveExpense(); break;
    case 'saveName': saveName(); break;
    case 'myName': S.sheet=null; openSheet('name'); break;
    case 'goStep': goStep(+t.dataset.s); break;
    case 'key': { const f=S.form; let v=String(f.amountStr||''); const k=t.dataset.k;
      if(k==='del') v=v.slice(0,-1); else if(k==='.'){ if(!v.includes('.')) v=(v||'0')+'.'; } else { if(/\.\d\d$/.test(v)) break; v=(v==='0'?'':v)+k; }
      if(v.replace('.','').length>9) break; f.amountStr=v; const a=document.getElementById('e-amt'); if(a) a.value=v; updatePreview(); refreshSentence(); break; }
    case 'scanReceipt': scanReceipt(); break;
    case 'copyInvite': { const u=location.href; (navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(u):Promise.reject()).then(()=>toast('Link copied',true),()=>toast('Copy the address from the top of Safari')); break; }
    case 'joinLink': S.form={jl:'',jlErr:''}; openSheet('joinlink'); setTimeout(()=>{ const i=document.getElementById('jl-url'); if(i) i.focus(); },320); break;
    case 'jlPaste': navigator.clipboard.readText().then(t=>{ const i=document.getElementById('jl-url'); if(i){ i.value=t; } S.form.jl=t; }).catch(()=>{}); break;
    case 'jlGo': { const i=document.getElementById('jl-url'), v=i?i.value:'', id=joinFromLink(v); if(!id){ S.form.jl=v; S.form.jlErr="That doesn't look like a Kitty invite link."; renderSheet(); break; }
      closeSheet(); S.joinAsked[id]=false; try{ location.hash='g-'+id; }catch(e){} toast('Opening the group...'); break; }
    case 'convEdit': { const f=S.form, g=G(f.gid), a=calc(f.amountStr), r=calc(f.rate); f.convEdit=true; if(!f.convAmt&&a>0&&r>0) f.convAmt=((a*r).toFixed(2)); renderSheet(); const i=document.getElementById('e-conv'); if(i){ i.focus(); i.select(); } break; }
    case 'toggleSplit': S.form.showSplit=!S.form.showSplit; if(!S.form.showSplit) S.form.mode='equal'; renderSheet(); if(S.form.step!==3) goStep(3); break;
    case 'toggleNote': S.form.showNote=!S.form.showNote; renderSheet(); { const n=document.getElementById('e-note'); if(n) n.focus(); } break;
    case 'delExp': { const f=S.form; const x=(S.exp[f.gid]||[]).find(e=>e.id===f.id); if(x) softDelete('groups/'+f.gid+'/expenses/'+x.id,x,'"'+x.desc+'" deleted',x.photoId); break; }
    case 'exp': openSheet('detail',{id:t.dataset.e}); break;
    case 'editExp': { const x=(S.exp[g.id]||[]).find(e=>e.id===S.sheet.data.id); if(x) newExpenseForm(g.id,x); break; }
    case 'nmToggle': { const x=(S.exp[g.id]||[]).find(e=>e.id===S.sheet.data.id); const me=myMid(g); if(x) setNotMine(x,me,!(x.notMine&&x.notMine[me])).then(ok=>{ if(ok){ toast('Updated'); renderSheet(); } }); break; }
    case 'nmKeep': { const x=(S.exp[g.id]||[]).find(e=>e.id===S.sheet.data.id); if(x) setNotMine(x,t.dataset.m,false).then(ok=>{ if(ok) renderSheet(); }); break; }
    case 'nmRemove': { const x=(S.exp[g.id]||[]).find(e=>e.id===S.sheet.data.id); if(x) removeFromExpense(x,t.dataset.m); break; }
    case 'markPaid': { const c=calcGroup(g), tr=c.transfers[Number(t.dataset.i)]; if(tr){ S.settleAsk=tr.from+'>'+tr.to; renderSheet(); } break; }
    case 'payNo': S.settleAsk=null; renderSheet(); break;
    case 'payYes': { const c=calcGroup(g), tr=c.transfers[Number(t.dataset.i)]; if(!tr) break; S.settleAsk=null;
      addPayment(g,tr.from,tr.to,tr.amount,true); break; }
    case 'recordPay': openSheet('pay',{}); break;
    case 'savePay': savePay(); break;
    case 'delPay': { const p=(S.pay[g.id]||[]).find(x=>x.id===t.dataset.p); if(!p) break; const row=t.closest('.orow'); foldAway(row,()=>softDelete('groups/'+g.id+'/payments/'+p.id,p,'Payment removed',null,true)); break; }
    case 'undo': { const u=S.undo; S.undo=null; hideToast('up'); if(u){ clearTimeout(u.timer); { const m=/\/expenses\/([^/]+)$/.exec(u.path); if(m) S.newAt[m[1]]=performance.now(); } localPut(u.path,u.body); render(); write(()=>S.db.doc(u.path).set(u.body)).then(ok=>{ if(ok) toast('Back again',true); }); } break; }
    case 'search': openSheet('search',{q:''}); break;
    case 'srOpen': { closeSheet(); go(t.dataset.g); setTimeout(()=>openSheet('detail',{id:t.dataset.e}),330); break; }
    case 'partyClose': endParty(); break;
    case 'calOpen': if(S.form.showCal) calClose(); else { S.form.showCal=true; S.form.calIn=true; S.form.calMonth=(S.form.startDate||today()).slice(0,7); renderSheet(); } break;
    case 'calNav': { const [y,mo]=S.form.calMonth.split('-').map(Number); const d=new Date(y,mo-1+Number(t.dataset.d),1); S.form.calMonth=isoOf(d).slice(0,7); renderSheet(); break; }
    case 'calDay': { const f=S.form, d=t.dataset.d; if(!f.startDate||f.endDate){ f.startDate=d; f.endDate=''; } else if(d<f.startDate){ f.startDate=d; } else { f.endDate=d; } renderSheet(); break; }
    case 'calClear': S.form.startDate=''; S.form.endDate=''; renderSheet(); break;
    case 'pet': { if(t._skip){ t._skip=false; break; } t.classList.remove('pet'); void t.offsetWidth; t.classList.add('pet'); clearTimeout(t._p); t._p=setTimeout(()=>t.classList.remove('pet'),900); break; }
    case 'working': S.showWorking=!S.showWorking; render(); break;
    case 'payInfo': openSheet('payInfo',{mid:t.dataset.m}); break;
    case 'copyPay': { const m=mem(g,S.sheet.data.mid); if(m) copyText(m.pay||''); break; }
    case 'copyLink': copyText(inviteLink(g)); break;
    case 'confirmYes': { const fn=S.confirm&&S.confirm.fn; if(S.confirm) S.confirm.done=true; closeSheet(); if(fn) fn(); break; }
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.search){ S.sheet.data.q=t.value; const r=document.getElementById('s-res'); if(r){ const h=searchList(t.value); sheetFlip(()=>{ r.innerHTML=h; }); } return; }
  if(!S.form) return;
  if(t.dataset.f){ const was=S.form[t.dataset.f]; if(t.dataset.f==='currency'&&was===t.value) return; S.form[t.dataset.f]=t.value; if(t.dataset.f==='rate'){ S.form.rateTouched=true; S.form.rateNote=''; const n=document.getElementById('rateNote'); if(n) n.textContent=''; } if(t.dataset.f==='convAmt'){ const a=calc(S.form.amountStr), c=parseFloat(String(t.value).replace(',','.')); if(a>0&&c>0){ S.form.rate=String(roundRate(c/a)); S.form.rateTouched=true; } refreshSentence(); } if(t.dataset.f==='convRate'){ S.form.convTouched=true; S.form.gRateNote=''; const n=document.getElementById('gRateNote'); if(n) n.textContent=''; } if(t.dataset.f==='currency' && S.sheet.kind==='expense'){ S.form.convEdit=false; S.form.convAmt=''; S.form.rateFailed=false; const g=G(S.form.gid); S.form.rate=t.value!==g.currency?rateFor(g,t.value):''; S.form.rateTouched=false; S.form.rateNote=''; renderSheet(); fillLiveRate('expense'); return; } if(t.dataset.f==='currency'&&S.sheet.kind==='group'){ const g=S.form.id&&G(S.form.id); if(g&&t.value!==g.currency){ const r=g.rates&&g.rates[t.value]; S.form.convRate=r?String(+(1/r).toFixed(6)):''; } S.form.convTouched=false; S.form.gRateNote=''; renderSheet(); fillLiveRate('group'); return; } if(t.dataset.f==='desc' && S.sheet.kind==='expense'){ clearTimeout(applyPrev._t); applyPrev._t=setTimeout(applyPrev,250); } updatePreview(); }
  else if(t.dataset.ex){ S.form.touchedSplit=true; S.form.exact[t.dataset.ex]=t.value; updatePreview(); }
  else if(t.dataset.mnew!=null){ S.form.newName=t.value; }
  else if(t.dataset.pay!=null){ S.form.members[Number(t.dataset.pay)].pay=t.value; }
});
document.addEventListener('change',e=>{ const t=e.target; if((t.id==='e-photo'||t.id==='e-photo-m') && t.files && t.files[0]) uploadPhoto(t.files[0]); if(t.tagName==='SELECT' && t.dataset.f && S.form){ S.form[t.dataset.f]=t.value; } if(t.id==='e-date' && S.form){ S.form.date=t.value||today(); renderSheet(); } });
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && S.sheet) closeSheet(); });
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target.id==='my-name'){ e.preventDefault(); saveName(); } });
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target.id==='m-new'){ e.preventDefault(); const ed=S.form.editIdx!=null; memCommit(!ed); renderSheet(); if(!ed) focusNew(); } if(e.key==='Enter'&&e.target.id==='g-title'&&S.form&&!S.form.id){ e.preventDefault(); gNext(); } });
document.addEventListener('keydown',e=>{ const t=e.target; if((e.key==='Enter'||e.key===' ')&&t.matches&&t.matches('span[role=button][data-a]')){ e.preventDefault(); t.click(); } });

boot();
})();
