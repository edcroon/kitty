<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Kitty</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kitty">
<meta name="theme-color" content="#F7F6F3">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="shim.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{--bg:#F7F6F3;--ink:#111111;--muted:#6B6862;--line:#E1DDD6;--pos:#1F4FD1;--neg:#B4430F;--warn:#B4430F;--mono:'IBM Plex Mono',ui-monospace,Menlo,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;overflow-x:hidden;overscroll-behavior-x:none;touch-action:pan-y;-webkit-text-size-adjust:100%;max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:'Inter Tight','Inter',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;font-size:16px}
button{font-family:inherit;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--pos);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding:calc(env(safe-area-inset-top) + 20px) 24px calc(env(safe-area-inset-bottom) + 112px)}
.stack{display:flex;flex-direction:column;gap:18px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 -10px 0 0}
.top .r{display:flex}
.brand{display:flex;align-items:center;gap:10px;margin-left:-4px}.brand .wm{display:block;margin-top:-2px}
.round{width:44px;height:44px;border:none;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;flex-shrink:0}
.back{margin-left:-12px}
.muted{color:var(--muted)}
.lab{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hero{display:flex;flex-direction:column;gap:6px;padding:30px 0 14px}
.hero .big{font-family:var(--mono);font-size:56px;font-weight:300;letter-spacing:-.04em;line-height:1}
.hero .big.sm{font-size:28px}
.hero .sub{font-size:14px;color:var(--muted)}
.sec{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 0 6px;border-bottom:1px solid var(--ink)}
.rows{display:flex;flex-direction:column}
.grow-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px;align-items:baseline;padding:14px 0;border:none;border-bottom:1px dashed var(--line);background:none;text-align:left;width:100%;cursor:pointer;font:inherit;color:inherit}
.grow-row .n{font-size:16px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grow-row .v{font-family:var(--mono);font-size:16px;white-space:nowrap}
.grow-row .s{font-size:12px;color:var(--muted)}
.grow-row .s.r{text-align:right}
.pos{color:var(--pos)}.neg{color:var(--neg)}.zero{color:var(--muted)}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:12px 24px calc(env(safe-area-inset-bottom) + 14px);background:var(--bg);border-top:1px solid var(--line);z-index:10}
.dock .in{max-width:432px;margin:0 auto;display:flex;gap:10px}
.btn{height:52px;border-radius:2px;border:1px solid var(--ink);font-size:15px;font-weight:500;cursor:pointer;padding:0 18px;background:transparent;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn.primary,.btn.dark{background:var(--ink);color:var(--bg)}
.btn.sm{height:38px;font-size:14px;padding:0 14px}
.btn.grow{flex:1}
.btn:disabled{opacity:.45;cursor:default}
.h1{font-size:15px;font-weight:500;margin:0;word-break:break-word}
.gtop{display:flex;flex-direction:column;gap:4px}
.gtop .big{font-family:var(--mono);font-size:44px;font-weight:300;letter-spacing:-.03em;line-height:1.05}
.gtop .sub{font-size:14px;color:var(--muted)}
.people{display:flex;flex-direction:column}
.person{display:flex;justify-content:space-between;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line);font-size:15px}
.person:first-child{border-top:1px solid var(--line)}
.person .num{font-size:15px}
.tabs{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line)}
.sbar{height:3px;background:var(--line);margin-top:5px}.sbar>div{height:3px;background:var(--ink);transition:width .5s cubic-bezier(.2,.8,.3,1)}
.srow{padding:9px 0;border-bottom:1px solid var(--line)}
.srow .l1{display:flex;align-items:baseline}.srow .l1 i{flex:1;border-bottom:1px dotted var(--muted);margin:0 8px 4px;min-width:12px}
.srow .pc{font-size:12px;color:var(--muted);margin-right:10px;font-family:var(--mono)}
.tabs button{border:none;background:none;font-size:15px;white-space:nowrap;color:var(--muted);padding:10px 0;margin-bottom:-1px;border-bottom:1.5px solid transparent;cursor:pointer}
.tabs button[aria-selected=true]{color:var(--ink);font-weight:600;border-bottom-color:var(--ink)}
.list{display:flex;flex-direction:column}
.item{display:flex;flex-direction:column;gap:2px;padding:12px 0;border:none;border-bottom:1px solid var(--line);width:100%;background:none;text-align:left;cursor:pointer;font:inherit;color:inherit}
.item .l1{display:flex;align-items:baseline;width:100%}
.item .l1 b{font-weight:400;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.item .l1 i{flex:1;border-bottom:1px dotted var(--muted);margin:0 8px 5px;min-width:14px}
.item .l1 .num{font-size:16px;white-space:nowrap}
.item .l2{font-size:13px;color:var(--muted)}
.flag{color:var(--warn)!important}
.swipe{position:relative;overflow:hidden}
.swipe .del{position:absolute;inset:0 0 1px 0;display:flex;align-items:center;justify-content:flex-end;padding:0 18px;background:rgba(180,35,24,var(--p,0));color:rgba(255,255,255,var(--p,0));font-size:15px;font-weight:500}
.swipe .item{position:relative;background:var(--bg);transition:transform .38s cubic-bezier(.25,.8,.3,1)}
.swipe.drag .item{transition:none}
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:36px 12px}
.empty .t{font-size:18px;font-weight:600}
.empty .d{font-size:14px;color:var(--muted);max-width:280px}
.day{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:18px 0 6px;border-bottom:1px solid var(--ink)}
.day .num{letter-spacing:0;color:var(--ink);font-size:13px}
.tl{display:flex;flex-direction:column;gap:8px;text-align:left;cursor:pointer;width:100%;padding:12px 0;font:inherit;color:inherit;background:none;border:none;border-bottom:1px solid var(--line)}
.tl img{display:block;width:100%;max-height:280px;object-fit:cover}
.tl p{margin:0;font-size:13px;color:var(--muted)}
.xfer{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.xfer .t{flex:1;font-size:15px}
.xfer .num{display:block;font-size:20px;font-weight:300;margin-top:2px}
.linkbtn{border:none;background:none;padding:0;font:inherit;font-size:13px;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer;margin-top:6px}
.banner{border-top:1px solid var(--ink);border-bottom:1px solid var(--line);padding:12px 0;font-size:14px}
.orow{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);gap:10px}
.av{display:none}
/* sheets */
#sheet .ov{position:fixed;inset:0;background:rgba(17,17,17,.35);z-index:20;display:flex;align-items:flex-end;justify-content:center;transition:opacity .22s}
#sheet .pn{background:var(--bg);width:100%;max-width:480px;max-height:92vh;overflow:auto;overflow-x:hidden;overscroll-behavior:contain;border-top:1px solid var(--ink);padding:14px 24px calc(env(safe-area-inset-bottom) + 24px);display:flex;flex-direction:column;gap:18px;transition:transform .24s cubic-bezier(.4,0,.6,1)}
#sheet .hd{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-right:-12px}
#sheet .hd h2{margin:0;font-size:20px;font-weight:600;letter-spacing:-.01em}
#sheet .grab{width:36px;height:4px;background:var(--line);margin:0 auto -6px;flex-shrink:0}
.f{display:flex;flex-direction:column;gap:6px}
.f>label,.lbl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.inp,select.inp,textarea.inp{width:100%;height:46px;border:none;border-bottom:1px solid var(--ink);border-radius:0;padding:0;font:inherit;font-size:17px;background:transparent;color:var(--ink)}
.inp::placeholder{color:#A9A39A}
select.inp{-webkit-appearance:none;appearance:none;background:transparent}
input[type=date].inp{-webkit-appearance:none;appearance:none;text-align:left;display:flex;align-items:center;min-width:0}
input[type=date].inp::-webkit-date-and-time-value{text-align:left;margin:0}
input[type=date].inp::-webkit-datetime-edit{padding:0}
textarea.inp{height:auto;min-height:64px;padding:10px 0;resize:vertical}
.hint{font-size:13px;color:var(--muted);min-height:18px}
.hint.bad{color:#B42318}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:36px;padding:0 13px;border-radius:2px;border:1px solid var(--line);background:transparent;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.split3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.split3 .chip{justify-content:center}
.prow{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);min-height:52px}
.prow .nm{flex:1;font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis}
.prow .sh{font-family:var(--mono);font-size:15px;white-space:nowrap}
.prow input.inp{width:110px;height:40px;font-family:var(--mono);font-size:16px;text-align:right}
.tick{width:22px;height:22px;border-radius:2px;border:1.5px solid var(--ink);background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;flex-shrink:0}
.tick[aria-checked=true]{background:var(--ink);color:var(--bg)}
.tick svg{width:14px;height:14px}
.x{width:44px;height:44px;border:none;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0}
.qty{width:32px;height:32px;border:1px solid var(--line);border-radius:2px;background:transparent;cursor:pointer;font-size:16px;padding:0}
.cal{border-bottom:1px solid var(--line);padding:4px 0 12px}
.calhd{display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:500;margin:0 -12px}
.calg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));row-gap:2px}
.cw{font-size:11px;letter-spacing:.06em;color:var(--muted);text-align:center;padding:4px 0 6px}
.cd{height:40px;border:none;background:none;font-family:var(--mono);font-size:14px;cursor:pointer;padding:0;color:var(--ink)}
.cd.tdy{text-decoration:underline;text-underline-offset:4px}
.cd.inr{background:#E9E4DA}
.cd.st{background:linear-gradient(90deg,transparent 50%,#E9E4DA 50%)}
.cd.en{background:linear-gradient(90deg,#E9E4DA 50%,transparent 50%)}
.cd.sel{color:var(--bg);position:relative;z-index:0}
.cd.sel::before{content:'';position:absolute;inset:2px;background:var(--ink);z-index:-1}
.calft{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding-top:10px}
.photo{display:block;width:100%;max-height:300px;object-fit:cover}
.qr{border-top:1px solid var(--ink);border-bottom:1px solid var(--line);padding:22px 0;display:flex;justify-content:center}
.qr img,.qr canvas{display:block}
.link{font-family:var(--mono);font-size:13px;word-break:break-all;border-bottom:1px solid var(--line);padding:10px 0;user-select:all}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.mem{display:flex;gap:8px;align-items:center}
.mem .inp{flex:1}
.danger{color:#B42318}
.photo-row{display:flex;flex-direction:column;gap:10px}
/* add expense */
.bigamt{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--ink);padding-bottom:6px}
.bigamt .cur{order:2;text-align:right;height:40px;border:none;background:transparent;font:inherit;font-size:15px;font-weight:500;padding:0 4px 0 0;color:var(--muted);-webkit-appearance:none;appearance:none}
.bigamt input{font-family:var(--mono);font-size:48px;font-weight:300;letter-spacing:-.03em;border:none;background:transparent;width:100%;color:var(--ink);padding:0;outline:none;text-align:left;min-width:0;order:1}
.bigamt input::placeholder{color:#CFC9BF}
.sumrow{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;border:none;border-bottom:1px solid var(--line);background:none;padding:12px 0;font:inherit;font-size:15px;cursor:pointer}
.sumrow b{font-weight:600}
.sumrow .go{font-size:13px;text-decoration:underline;text-underline-offset:3px}
.minis{display:flex;flex-wrap:wrap;gap:8px}
.mini{height:34px;border-radius:2px;border:1px dashed var(--muted);background:transparent;font:inherit;font-size:13px;padding:0 12px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;position:relative;overflow:hidden;color:var(--ink)}
.mini.on{border-style:solid;border-color:var(--ink)}
.mini input[type=date]{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.savebar{position:sticky;bottom:calc(-1 * (env(safe-area-inset-bottom) + 24px));margin:0 -24px calc(-1 * (env(safe-area-inset-bottom) + 24px));padding:12px 24px calc(env(safe-area-inset-bottom) + 18px);background:var(--bg);border-top:1px solid var(--line);display:flex;gap:10px}
.remhint{font-size:13px;color:var(--pos);margin-top:-12px}
/* search */
.srch .item .l2 .g{color:var(--ink)}
/* cat */
.catart{display:inline-flex;flex-shrink:0;line-height:0}
@keyframes kBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.bob{animation:kBob 2.8s ease-in-out infinite}
/* cat play */
.kcat{overflow:visible}
.k-body,.k-eyes,.k-coin{transform-box:fill-box}
.k-body{transform-origin:50% 100%}
.k-eyes{transform-origin:50% 50%}
.k-coin{transform-origin:50% 50%}
.catbtn{border:none;background:none;padding:0;cursor:pointer;-webkit-user-select:none;user-select:none}
.catbtn:active .k-body{transform:scale(1.06,.86)}
.catbtn .k-body{transition:transform .08s ease-out}
.pet .k-body{animation:kSquish .55s cubic-bezier(.3,.7,.4,1.5)}
.pet .k-coin{animation:kCoin .85s cubic-bezier(.45,0,.6,1)}
.pet .k-eyes,.blink .k-eyes{animation:kBlink .22s ease}
@keyframes kSquish{0%{transform:scale(1.06,.86)}35%{transform:scale(.94,1.1)}60%{transform:scale(1.03,.97)}100%{transform:none}}
@keyframes kCoin{0%{transform:none}22%{transform:translateY(-16px) rotate(-30deg)}55%{transform:translateY(30px) rotate(180deg);opacity:1}56%{opacity:0;transform:translateY(30px)}70%{opacity:0;transform:translateY(-12px)}100%{opacity:1;transform:none}}
@keyframes kBlink{0%,100%{transform:none}50%{transform:scaleY(.12)}}
#popcat{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 64px);z-index:9;pointer-events:none;display:flex;justify-content:center}
#popcat .in{display:flex;flex-direction:row-reverse;align-items:center;gap:10px;padding-left:70px;animation:kPeek 1.7s cubic-bezier(.3,.7,.4,1.2) forwards}
#popcat .lbl2{font-size:13px;font-weight:500;background:var(--ink);color:var(--bg);padding:4px 10px;border-radius:2px;opacity:0;animation:kFade .2s .35s forwards}
#popcat .k-coin{animation:kCoin .85s .35s cubic-bezier(.45,0,.6,1) both}
#popcat .k-body{animation:kSquish .55s .62s cubic-bezier(.3,.7,.4,1.5) both}
@keyframes kPeek{0%{transform:translateY(110px)}18%{transform:translateY(-6px)}26%{transform:translateY(0)}82%{transform:translateY(0)}100%{transform:translateY(120px)}}
/* toast */
#toast .gone{opacity:0!important}
#toast{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top) + 12px);z-index:40;pointer-events:none}
#toast div{pointer-events:auto;touch-action:none;cursor:pointer;transition:transform .2s ease,opacity .2s ease;background:var(--ink);color:var(--bg);font-size:14px;padding:11px 16px;border-radius:2px;max-width:90vw;white-space:nowrap;display:flex;align-items:center;gap:10px;position:relative;left:50%;width:max-content;transform:translateX(-50%);animation:kDrop .3s cubic-bezier(.2,.9,.3,1.1) both}
#toast .ck{display:inline-flex;width:16px;height:16px;color:var(--bg);animation:kTick .4s .08s cubic-bezier(.2,.9,.3,1.3) both}
#toast .ck svg{width:16px;height:16px}
#toast div button{pointer-events:auto;border:none;border-left:1px solid #444;background:none;color:var(--bg);font:inherit;font-size:14px;font-weight:600;padding:0 0 0 12px;margin-left:2px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
/* party */
#party{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(247,246,243,.96);animation:kFade .2s ease}
#party .big{font-size:34px;font-weight:600;letter-spacing:-.02em;animation:kPopIn .5s .15s cubic-bezier(.2,.9,.3,1.3) both}
#party .sub{font-size:15px;color:var(--muted);animation:kFade .4s .35s both}
#party .catart{animation:kJump .9s cubic-bezier(.3,.7,.4,1.2) both}
#party i{position:absolute;width:7px;height:11px;top:-20px;animation:kFall 1.8s linear forwards}
/* motion */
.btn,.round,.chip,.tick,.x,.mini,.qty,.tabs button{transition:transform .14s cubic-bezier(.3,.7,.4,1.4),background-color .15s,opacity .15s}
.btn:active,.round:active,.chip:active,.tick:active,.x:active,.mini:active,.qty:active{transform:scale(.95)}
.item,.grow-row,.tl,.sumrow{transition:background-color .15s,opacity .15s}
.item:active,.grow-row:active,.tl:active,.sumrow:active{opacity:.55}
@keyframes kUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes kFade{from{opacity:0}to{opacity:1}}
@keyframes kIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes kBack{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
@keyframes kNew{0%{opacity:0;transform:translateY(-8px)}40%{opacity:1;transform:none;background:#EDE7DB}100%{background:transparent}}
@keyframes kDrop{from{opacity:0;transform:translate(-50%,-12px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes kTick{0%{transform:scale(0)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
@keyframes kPopIn{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
@keyframes kJump{0%{transform:translateY(60px) scale(.6);opacity:0}45%{transform:translateY(-16px) scale(1.06);opacity:1}70%{transform:translateY(3px)}100%{transform:none}}
@keyframes kFall{to{transform:translateY(110vh) rotate(540deg)}}
#sheet.anim .ov{animation:kFade .22s ease}
#sheet.anim .pn{animation:kUp .32s cubic-bezier(.2,.9,.25,1)}
#sheet.closing .ov{opacity:0}
#sheet.closing .pn{transform:translateY(100%)}
#sheet.dragging .pn{transition:none}
#app.in{animation:kIn .26s cubic-bezier(.2,.8,.3,1)}
#app.back{animation:kBack .26s cubic-bezier(.2,.8,.3,1)}
.item.new{animation:kNew 1.3s ease}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app" aria-live="polite"></div>
<div id="sheet"></div>
<div id="toast" role="status"></div>
<script>
(function(){
'use strict';
const APP_URL = location.origin+location.pathname;
const COLOURS = ['#FFD6C2','#CFE3FF','#C9F2DC','#E4D9FF','#FFF0A8','#FFD3E8'];
const AVC = ['#1A1A1A','#2563EB','#9A3412','#047857','#7C3AED','#BE185D','#0E7490','#A16207','#4338CA','#B91C1C'];
const CURS = ['GBP','EUR','USD','CAD','AUD','NZD','CHF','SEK','NOK','DKK','ISK','PLN','CZK','HUF','TRY','AED','MAD','ZAR','THB','JPY','SGD','HKD','MXN'];
const CATS = {meal:'Meal',drinks:'Drinks',groceries:'Groceries',transport:'Transport',stay:'Stay',tickets:'Tickets',other:'Other'};
const MEALS = {breakfast:'Breakfast',lunch:'Lunch',dinner:'Dinner',other:'Other meal'};

/* ---------- helpers ---------- */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rid = p => (p||'') + Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4);
function fmt(p, cur){ const v=(p||0)/100; try{ return new Intl.NumberFormat('en-GB',{style:'currency',currency:cur||'GBP'}).format(v); }catch(e){ return v.toFixed(2)+' '+(cur||''); } }
function sym(cur){ try{ return new Intl.NumberFormat('en-GB',{style:'currency',currency:cur,currencyDisplay:'narrowSymbol'}).formatToParts(0).find(x=>x.type==='currency').value; }catch(e){ return cur; } }
function today(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function ord(n){ const s=['th','st','nd','rd'], v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); }
function pd(s){ const [y,m,d]=String(s||today()).split('-').map(Number); return new Date(y,(m||1)-1,d||1); }
function dShort(s){ return pd(s).toLocaleDateString('en-GB',{weekday:'short'}); }
function dLong(s){ const d=pd(s); return d.toLocaleDateString('en-GB',{weekday:'short'})+' '+ord(d.getDate())+' '+d.toLocaleDateString('en-GB',{month:'short'}); }
function dDiff(a,b){ return Math.round((pd(b)-pd(a))/86400000); }
function calc(str){
  const s = String(str==null?'':str).replace(/[£$€¥,\s]/g,'').replace(/[x×]/gi,'*').replace(/÷/g,'/');
  if(!s) return null;
  if(!/^[0-9+\-*/().]+$/.test(s)) return NaN;
  let i=0;
  function num(){ const st=i; while(i<s.length && /[0-9.]/.test(s[i])) i++; if(st===i) throw 0; const v=parseFloat(s.slice(st,i)); if(isNaN(v)) throw 0; return v; }
  function factor(){ if(s[i]==='-'){i++;return -factor();} if(s[i]==='+'){i++;return factor();} if(s[i]==='('){i++; const v=expr(); if(s[i]!==')') throw 0; i++; return v;} return num(); }
  function term(){ let v=factor(); while(s[i]==='*'||s[i]==='/'){ const op=s[i++]; const r=factor(); v=op==='*'?v*r:v/r; } return v; }
  function expr(){ let v=term(); while(s[i]==='+'||s[i]==='-'){ const op=s[i++]; const r=term(); v=op==='+'?v+r:v-r; } return v; }
  try{ const v=expr(); if(i!==s.length||!isFinite(v)) return NaN; return v; }catch(e){ return NaN; }
}
function allocate(total, weights){
  const sum = weights.reduce((a,b)=>a+b,0);
  if(sum<=0) return weights.map(()=>0);
  const raw = weights.map(w=>total*w/sum), fl = raw.map(Math.floor);
  let rem = total - fl.reduce((a,b)=>a+b,0);
  const order = raw.map((r,i)=>[r-fl[i],i]).sort((a,b)=>b[0]-a[0]||a[1]-b[1]);
  for(let k=0;k<rem;k++) fl[order[k%order.length][1]]++;
  return fl;
}
function guessCat(desc){
  const words = String(desc||'').toLowerCase().split(/[^a-z]+/);
  if(words.includes('breakfast')||words.includes('brunch')) return {cat:'meal',meal:'breakfast'};
  if(words.includes('lunch')) return {cat:'meal',meal:'lunch'};
  if(words.includes('dinner')||words.includes('supper')) return {cat:'meal',meal:'dinner'};
  for(const c of Object.keys(CAT_WORDS)) if(words.some(w=>CAT_WORDS[c].includes(w))) return {cat:c,meal:c==='meal'?'other':null};
  return {cat:'other',meal:null};
}

function errText(e){
  const c=e&&e.code;
  if(c==='quota_exceeded') return 'Kitty is full - delete an old group to make room.';
  if(c==='invalid_argument'){ return "That didn't save - you might only have view access."; }
  if(c==='revoked') return 'Your access to Kitty has changed.';
  return "Couldn't save just now - try again.";
}
async function write(fn){
  try{ await fn(); return true; }
  catch(e){
    if(e && e.code==='unavailable'){ await new Promise(r=>setTimeout(r,400+Math.random()*600)); try{ await fn(); return true; }catch(e2){ toast(errText(e2)); return false; } }
    if(e && e.code==='invalid_argument' && S.canWrite===null) { S.canWrite=false; render(); }
    toast(errText(e)); return false;
  }
}

/* ---------- model ---------- */
const G = id => S.groups[id];
const myMid = g => { if(!g||!S.uid) return null; const m=(g.members||[]).find(m=>m.uid===S.uid); return m?m.id:null; };
const mem = (g,mid) => (g.members||[]).find(m=>m.id===mid);
function mName(g,mid,you){ if(you!==false && mid===myMid(g)) return 'You'; const m=mem(g,mid); return m?m.name:'Someone'; }
function avColour(g,mid){ const i=(g.members||[]).findIndex(m=>m.id===mid); return AVC[(i<0?0:i)%AVC.length]; }
function initial(g,mid){ const m=mem(g,mid); return esc(((m&&m.name)||'?').trim().charAt(0).toUpperCase()); }
function avatar(g,mid,cls){ return '<span class="av '+(cls||'')+'" style="background:'+avColour(g,mid)+'" aria-hidden="true">'+initial(g,mid)+'</span>'; }
function expensesOf(gid){ return (S.exp[gid]||[]).slice().sort((a,b)=> (b.date||'').localeCompare(a.date||'') || (b.createdAt||0)-(a.createdAt||0)); }
function calcGroup(g){
  const ex=S.exp[g.id]||[], pays=S.pay[g.id]||[], bal={};
  (g.members||[]).forEach(m=>bal[m.id]=0);
  let spent=0;
  ex.forEach(x=>{ const b=x.base||0; spent+=b; bal[x.paidBy]=(bal[x.paidBy]||0)+b; Object.keys(x.shares||{}).forEach(m=>{ bal[m]=(bal[m]||0)-x.shares[m]; }); });
  pays.forEach(p=>{ bal[p.from]=(bal[p.from]||0)+p.amount; bal[p.to]=(bal[p.to]||0)-p.amount; });
  Object.keys(bal).forEach(m=>{ if(Math.abs(bal[m])<=2) bal[m]=0; });
  return {bal, spent, transfers:settle(bal)};
}
function settle(bal){
  const cr=[],dr=[];
  Object.keys(bal).forEach(m=>{ const v=bal[m]; if(v>0) cr.push([m,v]); else if(v<0) dr.push([m,-v]); });
  cr.sort((a,b)=>b[1]-a[1]); dr.sort((a,b)=>b[1]-a[1]);
  const out=[]; let i=0,j=0;
  while(i<dr.length&&j<cr.length){ const a=Math.min(dr[i][1],cr[j][1]); if(a>0) out.push({from:dr[i][0],to:cr[j][0],amount:a}); dr[i][1]-=a; cr[j][1]-=a; if(dr[i][1]===0)i++; if(cr[j][1]===0)j++; }
  return out;
}
function myGroups(){ return Object.values(S.groups).filter(g=>myMid(g)).sort((a,b)=>(b.touchedAt||b.createdAt||0)-(a.touchedAt||a.createdAt||0)); }
function otherGroups(){ return Object.values(S.groups).filter(g=>!myMid(g)).sort((a,b)=>(a.name||'').localeCompare(b.name||'')); }
function canEdit(){ return S.canWrite!==false; }

/* ---------- data ---------- */
function useCap(n){
  return new Promise(res=>{
    let tries=0;
    (function go(){ if(window.claude && typeof window.claude.use==='function'){ Promise.resolve(window.claude.use(n)).then(res,()=>res(null)); } else if(tries++<30){ setTimeout(go,100); } else res(null); })();
  });
}
async function boot(){
  render();
  const t=setTimeout(()=>{ S.slow=true; render(); },10000);
  const [db,user,assets] = await Promise.all([useCap('db'),useCap('user'),useCap('assets')]);
  S.db=db; S.user=user; S.assets=assets;
  if(!db){ clearTimeout(t); S.loading=false; S.err='nodb'; render(); return; }
  if(user){
    try{ S.uid = await user.id(); }catch(e){}
    try{ const c = await user.can('data.write'); S.canWrite = (c===false)?false:(c===true?true:null); }catch(e){ S.canWrite=null; }
    try{ if(S.uid){ const ps=await user.profiles([S.uid]); S.profileName=(ps&&ps[S.uid]&&ps[S.uid].name)||''; } }catch(e){}
  }
  db.collection('groups').onSnapshot(snap=>{
    if(!snap.metadata.fromCache){ clearTimeout(t); S.slow=false; }
    S.loading=false;
    const g={}; snap.docs.forEach(d=>{ g[d.id]=Object.assign({id:d.id},d.data()); });
    S.groups=g; syncSubs(); route(); render();
  }, e=>{ clearTimeout(t); S.loading=false; S.err=e.code||'err'; render(); });
}
function syncSubs(){
  const want=new Set(Object.values(S.groups).filter(g=>myMid(g)||g.id===S.gid).map(g=>g.id));
  Object.keys(S.subs).forEach(gid=>{ if(!want.has(gid)){ S.subs[gid].forEach(u=>u()); delete S.subs[gid]; } });
  want.forEach(gid=>{
    if(S.subs[gid]) return;
    const ref=S.db.doc('groups/'+gid);
    const u1=ref.collection('expenses').onSnapshot(s=>{ S.exp[gid]=s.docs.map(d=>Object.assign({id:d.id},d.data())); render(); },()=>{});
    const u2=ref.collection('payments').onSnapshot(s=>{ S.pay[gid]=s.docs.map(d=>Object.assign({id:d.id},d.data())); render(); },()=>{});
    S.subs[gid]=[u1,u2];
  });
}

/* ---------- routing ---------- */
function route(){
  const h=(location.hash||'').replace(/^#/,'');
  if(h.indexOf('g-')===0){
    const gid=h.slice(2);
    if(S.groups[gid]){
      if(S.view!=='group'||S.gid!==gid){ S.view='group'; S.gid=gid; S.tab='list'; syncSubs(); }
      const g=S.groups[gid];
      if(!myMid(g) && canEdit() && S.uid && !S.joinAsked[gid] && !S.sheet){ S.joinAsked[gid]=true; openSheet('join'); }
      return;
    }
  }
  if(S.view!=='home'){ S.view='home'; S.gid=null; }
}
function go(gid){
  S.nav=gid?'in':'back';
  if(gid){ S.view='group'; S.gid=gid; S.tab='list'; syncSubs(); try{ location.hash='g-'+gid; }catch(e){} }
  else { S.view='home'; S.gid=null; try{ location.hash='home'; }catch(e){} }
  route(); render(); window.scrollTo(0,0);
}
window.addEventListener('hashchange',()=>{ route(); render(); });

/* ---------- render: main ---------- */
S.counts={}; S.seen={};
function cnt(key,p,cur){ return '<span class="num" data-count="'+esc(key)+'" data-v="'+p+'" data-cur="'+esc(cur)+'">'+fmt(p,cur)+'</span>'; }
function countUp(){
  document.querySelectorAll('[data-count]').forEach(el=>{
    const k=el.dataset.count, v=Number(el.dataset.v), cur=el.dataset.cur, from=S.counts[k];
    S.counts[k]=v;
    if(from==null||from===v||matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const t0=performance.now(), d=550;
    (function step(t){ const q=Math.min(1,(t-t0)/d), e=1-Math.pow(1-q,3); el.textContent=fmt(Math.round(from+(v-from)*e),cur); if(q<1&&el.isConnected) requestAnimationFrame(step); })(t0);
  });
}
function setPage(c){ document.body.style.background=c; document.documentElement.style.setProperty('--page',c); const tc=document.querySelector('meta[name=theme-color]'); if(tc) tc.content=c.indexOf('var(')===0?'#F7F6F3':c; }
function render(){
  const app=document.getElementById('app');
  const nav=S.nav; S.nav=null;
  if(nav){ app.classList.remove('in','back'); void app.offsetWidth; app.classList.add(nav); clearTimeout(render._t); render._t=setTimeout(()=>app.classList.remove('in','back'),320); }
  setTimeout(countUp,0);
  if(S.loading){ setPage('var(--bg)'); app.innerHTML='<div class="top">'+brand()+'</div><p class="muted" style="margin-top:24px">'+(S.slow?"Can't reach Kitty's data yet - check your connection.":'Loading...')+'</p>'; return; }
  if(S.err){ setPage('var(--bg)'); app.innerHTML='<div class="top">'+brand()+'</div><div class="banner" style="margin-top:24px">'+(S.err==='nodb'?'Kitty needs you to be signed in to Claude to load your groups.':'Kitty can\'t load right now. Try reopening the page.')+'</div>'; return; }

function dateRange(g){
  const a=g.startDate, b=g.endDate; if(!a&&!b) return '';
  const f=d=>{ const x=pd(d); return ord(x.getDate())+' '+x.toLocaleDateString('en-GB',{month:'short'}); };
  if(a&&b) return a===b?f(a):f(a)+' - '+f(b);
  return a?'from '+f(a):'until '+f(b);
}
function forecast(g,spent){
  const t=today(), ex=S.exp[g.id]||[];
  if(g.startDate && t<g.startDate){ const n=dDiff(t,g.startDate); return n===1?'Starts tomorrow':'Starts in '+n+' days'; }
  if(!g.endDate || t>g.endDate) return '';
  if(!ex.length) return g.endDate===t?'Last day today':'Ends '+esc(dLong(g.endDate));
  const first=g.startDate||ex.reduce((a,x)=>x.date&&x.date<a?x.date:a, t);
  const elapsed=Math.max(1,dDiff(first,t)+1), total=Math.max(elapsed,dDiff(first,g.endDate)+1);
  if(elapsed<2||total<=elapsed) return g.endDate===t?'Last day today':'Ends '+esc(dLong(g.endDate));
  const proj=Math.round(spent/elapsed*total);
  return 'At this rate, about '+fmt(proj,g.currency)+' by '+esc(dLong(g.endDate));
}
function itemMeta(g,x){
  const n=Object.keys(x.shares||{}).length, parts=[];
  parts.push(dShort(x.date));
  if(x.currency!==g.currency) parts.push(fmt(x.amount,x.currency));
  else parts.push(n===(g.members||[]).length&&x.mode==='equal'?'split '+n+' ways':n===1?'for '+mName(g,Object.keys(x.shares)[0]):'split '+n+' ways');
  return esc(parts.join(' · '));
}
function flagText(g,x){
  const ids=Object.keys(x.notMine||{}).filter(k=>x.notMine[k]);
  if(!ids.length) return '';
  const names=ids.map(id=>mName(g,id));
  return names.join(', ')+(ids.length===1?(names[0]==='You'?' said not yours':' says not theirs'):' say not theirs');
}
function expRow(g,x,cls){

function working(g,c){

  });

function renderSpending(g,c){
  const ex=S.exp[g.id]||[];

function isoOf(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

  for(let i=0;i<lead;i++) h+='<span></span>';
  for(let d=1;d<=days;d++){
    const iso=isoOf(new Date(y,mo-1,d));
    const sel=iso===a||iso===b, inr=a&&b&&iso>a&&iso<b;
    h+='<button class="cd'+(sel?' sel':'')+(inr?' inr':'')+(iso===t?' tdy':'')+(iso===a&&b&&b!==a?' st':'')+(iso===b&&a!==b?' en':'')+'" data-a="calDay" data-d="'+iso+'" aria-pressed="'+sel+'" aria-label="'+esc(dLong(iso))+'">'+d+'</button>';
  }

async function saveGroup(){

  const body={name:name.slice(0,60),colour:f.colour,currency:f.currency,budget:0,startDate:f.startDate||'',endDate:f.endDate||'',members:clean,touchedAt:Date.now()};

  } else {
    const g=G(f.id), hasMoney=(S.exp[f.id]||[]).length>0||(S.pay[f.id]||[]).length>0;

      err.textContent='Converting...';

      if(ok){ closeSheet(); toast('Switched to '+f.currency); } else err.textContent='Some of it didn\'t convert - try again.';
      return;
    }

    if(ok){ closeSheet(); toast('Saved'); }

}
async function convertGroup(g,cur,r,body){
  const from=g.currency, base='groups/'+g.id;
  for(const x of (S.exp[g.id]||[])){
    const y=Object.assign({},x); delete y.id;
    let nb, nr;
    if(x.currency===cur){ nb=x.amount; nr=1; }
    else if(x.currency===from){ nb=Math.round(x.amount*r); nr=r; }
    else { nr=(x.rate||1)*r; nb=Math.round(x.amount*nr); }
    const ids=Object.keys(x.shares||{});
    const parts=allocate(nb,ids.map(id=>x.shares[id]));
    const shares={}; ids.forEach((id,i)=>shares[id]=parts[i]);
    y.base=nb; y.rate=nr; y.shares=shares; y.exact=Object.assign({},x.exact||{}); y.weights=Object.assign({},x.weights||{}); y.notMine=Object.assign({},x.notMine||{}); y.updatedAt=Date.now();
    if(!(await write(()=>S.db.doc(base+'/expenses/'+x.id).set(y)))) return false;
  }
  for(const p of (S.pay[g.id]||[])){
    const y=Object.assign({},p); delete y.id; y.amount=Math.round(p.amount*r);
    if(!(await write(()=>S.db.doc(base+'/payments/'+p.id).set(y)))) return false;
  }
  const rates={}; Object.keys(g.rates||{}).forEach(k=>{ if(k!==cur) rates[k]=+(g.rates[k]*r).toFixed(6); }); rates[from]=+r.toFixed(6);
  const full=Object.assign({},g); delete full.id;
  Object.assign(full,body,{currency:cur,rates});
  return write(()=>S.db.doc(base).set(full));
}
async function deleteGroup(gid){
  const ex=S.exp[gid]||[], ps=S.pay[gid]||[];

  for(const p of ps){ await write(()=>S.db.doc('groups/'+gid+'/payments/'+p.id).delete()); }
  const ok=await write(()=>S.db.doc('groups/'+gid).delete());
  if(ok){ closeSheet(); go(null); toast('Group deleted'); }
}

function effCat(f){ return f.cat==='auto'?guessCat(f.desc):{cat:f.cat,meal:f.cat==='meal'?(f.meal||'other'):null}; }
function catChips(f){
  const e=effCat(f);
  let h='<div class="chips">'+Object.keys(CATS).map(c=>'<button class="chip" aria-pressed="'+(e.cat===c)+'" data-a="cat" data-c="'+c+'">'+CATS[c]+'</button>').join('')+'</div>';
  if(e.cat==='meal') h+='<div class="lbl" style="margin:12px 0 6px">Which meal?</div><div class="chips">'+Object.keys(MEALS).map(m=>'<button class="chip" aria-pressed="'+(e.meal===m)+'" data-a="meal" data-c="'+m+'">'+MEALS[m]+'</button>').join('')+'</div>';
  return h;

function computeShares(f,g){
  const v=calc(f.amountStr); const total=(v>0)?Math.round(v*100):0;
  const ids=(g.members||[]).map(m=>m.id).filter(id=>f.inc[id]);
  let parts;
  if(f.mode==='equal') parts=allocate(total,ids.map(()=>1));
  else if(f.mode==='shares') parts=allocate(total,ids.map(id=>Math.max(0,Number(f.shares[id])||0)));
  else parts=ids.map(id=>{ const x=calc(f.exact[id]); return x>0?Math.round(x*100):0; });
  const foreign=f.currency!==g.currency;
  const rate=foreign?calc(f.rate):1;
  const base=(rate>0)?Math.round(total*rate):0;
  const baseParts=foreign?allocate(base,parts):parts;
  return {total,ids,parts,rate,base,baseParts,sum:parts.reduce((a,b)=>a+b,0),foreign};
}

    if(r.foreign && r.total && r.rate>0) t+=(t?'  ·  ':'')+'≈ '+fmt(r.base,g.currency);

    else if(f.mode==='exact'){ const left=r.total-r.sum; si.textContent= left===0?'Adds up':(left>0?fmt(left,f.currency)+' still to assign':fmt(-left,f.currency)+' too much'); if(left!==0) si.classList.add('bad'); }

async function saveExpense(){
  const f=S.form, g=G(f.gid), err=document.getElementById('e-err');
  let desc=(f.desc||'').trim(); desc=desc.charAt(0).toUpperCase()+desc.slice(1); const r=computeShares(f,g);
  if(!desc){ err.textContent='Say what it was.'; return; }
  if(!(r.total>0)){ err.textContent='Add an amount.'; return; }
  if(r.foreign && !(r.rate>0)){ err.textContent='Add the exchange rate.'; return; }
  if(!r.ids.length){ err.textContent='Tick at least one person.'; return; }
  if(f.mode==='exact' && r.sum!==r.total){ err.textContent="The amounts don't add up to the total."; return; }
  if(f.mode==='shares' && r.parts.every(p=>p===0)){ err.textContent='Give someone at least one share.'; return; }
  const shares={}, exact={}, weights={};
  r.ids.forEach((id,i)=>{ shares[id]=r.baseParts[i]; if(f.mode==='exact') exact[id]=r.parts[i]; if(f.mode==='shares') weights[id]=Number(f.shares[id])||0; });
  const notMine={}; Object.keys(f.notMine||{}).forEach(k=>{ if(f.notMine[k] && shares[k]!=null) notMine[k]=true; });
  const catManual=f.cat!=='auto', ec=effCat(f);
  const body={desc:desc.slice(0,60),amount:r.total,currency:f.currency,rate:r.foreign?r.rate:1,base:r.base,paidBy:f.paidBy,date:f.date||today(),cat:ec.cat,meal:ec.meal||null,catManual,note:(f.note||'').slice(0,400),mode:f.mode,shares,exact,weights,photoId:f.photoId||null,notMine,createdAt:f.createdAt||Date.now(),createdBy:f.createdBy||S.uid||null,updatedAt:Date.now()};
  const id=f.id||rid('e');
  const ok=await write(()=>S.db.doc('groups/'+g.id+'/expenses/'+id).set(body));
  if(!ok) return;
  closeSheet(); if(f.id) toast('Saved',true); else setTimeout(()=>popCat('Added'),260);
  const upd={touchedAt:Date.now()}; if(r.foreign) upd.rates={[f.currency]:r.rate};
  write(()=>S.db.doc('groups/'+g.id).update(upd));
}
async function uploadPhoto(file){
  const f=S.form; if(!f||!S.assets||!file) return;
  f.uploading=true; renderSheet();
  let blob=file;
  try{
    const bmp=await createImageBitmap(file);
    const sc=Math.min(1,1600/Math.max(bmp.width,bmp.height));
    const c=document.createElement('canvas'); c.width=Math.round(bmp.width*sc); c.height=Math.round(bmp.height*sc);
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    blob=await new Promise(res=>c.toBlob(b=>res(b||file),'image/jpeg',0.82));
  }catch(e){ blob=file; }
  try{ const a=await S.assets.upload(blob); if(S.form===f){ f.photoId=a.id; } }
  catch(e){ toast(e&&e.code==='quota_exceeded'?'No room for more photos':"Couldn't upload that photo"); }
  if(S.form===f){ f.uploading=false; renderSheet(); }
}

    case 'exp': openSheet('detail',{id:t.dataset.e}); break;
    case 'editExp': { const x=(S.exp[g.id]||[]).find(e=>e.id===S.sheet.data.id); if(x) newExpenseForm(g.id,x); break; }
    case 'nmToggle': { const x=(S.exp[g.id]||[]).find(e=>e.id===S.sheet.data.id); const me=myMid(g); if(x) setNotMine(x,me,!(x.notMine&&x.notMine[me])).then(ok=>{ if(ok){ toast('Updated'); renderSheet(); } }); break; }
    case 'nmKeep': { const x=(S.exp[g.id]||[]).find(e=>e.id===S.sheet.data.id); if(x) setNotMine(x,t.dataset.m,false).then(ok=>{ if(ok) renderSheet(); }); break; }
    case 'nmRemove': { const x=(S.exp[g.id]||[]).find(e=>e.id===S.sheet.data.id); if(x) removeFromExpense(x,t.dataset.m); break; }
    case 'markPaid': { const c=calcGroup(g), tr=c.transfers[Number(t.dataset.i)]; if(tr) confirmBox('Mark as paid?',mName(g,tr.from)+' '+(tr.from===myMid(g)?'paid':'paid')+' '+mName(g,tr.to)+' '+fmt(tr.amount,g.currency)+'.','Yes, paid',()=>addPayment(g,tr.from,tr.to,tr.amount)); break; }
    case 'recordPay': openSheet('pay',{}); break;
    case 'savePay': savePay(); break;
    case 'delPay': { const p=(S.pay[g.id]||[]).find(x=>x.id===t.dataset.p); if(p) softDelete('groups/'+g.id+'/payments/'+p.id,p,'Payment removed'); break; }
    case 'undo': { const u=S.undo; S.undo=null; document.getElementById('toast').innerHTML=''; if(u){ clearTimeout(u.timer); write(()=>S.db.doc(u.path).set(u.body)).then(ok=>{ if(ok) toast('Back again',true); }); } break; }
    case 'search': openSheet('search',{q:''}); break;
    case 'srOpen': { closeSheet(); go(t.dataset.g); setTimeout(()=>openSheet('detail',{id:t.dataset.e}),330); break; }
    case 'partyClose': endParty(); break;
    case 'calOpen': S.form.showCal=!S.form.showCal; if(S.form.showCal) S.form.calMonth=(S.form.startDate||today()).slice(0,7); renderSheet(); break;
    case 'calNav': { const [y,mo]=S.form.calMonth.split('-').map(Number); const d=new Date(y,mo-1+Number(t.dataset.d),1); S.form.calMonth=isoOf(d).slice(0,7); renderSheet(); break; }
    case 'calDay': { const f=S.form, d=t.dataset.d; if(!f.startDate||f.endDate){ f.startDate=d; f.endDate=''; } else if(d<f.startDate){ f.startDate=d; } else { f.endDate=d; } renderSheet(); break; }
    case 'calClear': S.form.startDate=''; S.form.endDate=''; renderSheet(); break;
    case 'pet': { t.classList.remove('pet'); void t.offsetWidth; t.classList.add('pet'); clearTimeout(t._p); t._p=setTimeout(()=>t.classList.remove('pet'),900); break; }
    case 'working': S.showWorking=!S.showWorking; render(); break;
    case 'payInfo': openSheet('payInfo',{mid:t.dataset.m}); break;
    case 'copyPay': { const m=mem(g,S.sheet.data.mid); if(m) copyText(m.pay||''); break; }
    case 'copyLink': copyText(inviteLink(g)); break;
    case 'confirmYes': { const fn=S.confirm&&S.confirm.fn; closeSheet(); if(fn) fn(); break; }
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.search){ S.sheet.data.q=t.value; const r=document.getElementById('s-res'); if(r) r.innerHTML=searchList(t.value); return; }
  if(!S.form) return;
  if(t.dataset.f){ S.form[t.dataset.f]=t.value; if(t.dataset.f==='currency' && S.sheet.kind==='expense'){ const g=G(S.form.gid); S.form.rate=t.value!==g.currency?rateFor(g,t.value):''; renderSheet(); return; } if(t.dataset.f==='currency'&&S.sheet.kind==='group'){ const g=S.form.id&&G(S.form.id); if(g&&t.value!==g.currency){ const r=g.rates&&g.rates[t.value]; S.form.convRate=r?String(+(1/r).toFixed(6)):''; } renderSheet(); return; } if(t.dataset.f==='desc' && S.sheet.kind==='expense'){ clearTimeout(applyPrev._t); applyPrev._t=setTimeout(applyPrev,250); } updatePreview(); }
  else if(t.dataset.ex){ S.form.touchedSplit=true; S.form.exact[t.dataset.ex]=t.value; updatePreview(); }
  else if(t.dataset.m!=null && t.tagName==='INPUT'){ S.form.members[Number(t.dataset.m)].name=t.value; }
  else if(t.dataset.pay!=null){ S.form.members[Number(t.dataset.pay)].pay=t.value; }
});
document.addEventListener('change',e=>{ const t=e.target; if(t.id==='e-photo' && t.files && t.files[0]) uploadPhoto(t.files[0]); if(t.tagName==='SELECT' && t.dataset.f && S.form){ S.form[t.dataset.f]=t.value; } if(t.id==='e-date' && S.form){ S.form.date=t.value||today(); renderSheet(); } });
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && S.sheet) closeSheet(); });

boot();
})();
</script>
<script>
if('serviceWorker' in navigator){
  let first=!navigator.serviceWorker.controller;
  let shown=performance.now();
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{ try{ r.update(); }catch(e){}
    document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'){ shown=performance.now(); try{ r.update(); }catch(e){} } });
  }).catch(()=>{});
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(first){ first=false; return; }
    if(performance.now()-shown<4000 && !document.querySelector('#sheet .pn')){ location.reload(); return; }
    if(document.getElementById('kupd')) return;
    const b=document.createElement('button'); b.id='kupd'; b.textContent='New version of Kitty - tap to update';
    b.style.cssText='position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 12px);z-index:60;background:#111;color:#F7F6F3;border:none;border-radius:2px;padding:11px 16px;font:inherit;font-size:14px;white-space:nowrap';
    b.onclick=()=>location.reload(); document.body.appendChild(b);
  });
}
</script>
