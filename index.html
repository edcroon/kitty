.hero .big .num{font:inherit;letter-spacing:inherit;font-variant-numeric:inherit;display:inline;margin:0}
.hero .big{white-space:nowrap}.hero .big.sm{white-space:normal}
:root{--brand:#5C8DFF;--r:10px;--num:'Kitty Num','Inter Tight',system-ui,sans-serif}

:root{--bg:#F7F6F3;--ink:#111111;--muted:#6B6862;--line:#E1DDD6;--pos:#1F4FD1;--neg:#B4430F;--warn:#B4430F;--mono:'IBM Plex Mono',ui-monospace,Menlo,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;overflow-x:hidden;overscroll-behavior:none;touch-action:pan-y;-webkit-text-size-adjust:100%;max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:'Inter Tight','Inter',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;font-size:16px}
button{font-family:inherit;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--pos);outline-offset:2px}
.num{font-family:var(--num);font-weight:600;font-variant-numeric:tabular-nums lining-nums;letter-spacing:-.01em}
.ink{color:var(--ink)}
#app{box-sizing:border-box;max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;padding:calc(env(safe-area-inset-top) + 20px) 24px calc(env(safe-area-inset-bottom) + 112px)}
.stack{display:flex;flex-direction:column;gap:18px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 -10px 0 0}
.top .r{display:flex}
.brand{display:flex;align-items:center;gap:10px;margin-left:-4px}.brand .wm{display:block;margin-top:-2px}
.round{width:44px;height:44px;border:none;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;flex-shrink:0}
.back{margin-left:-12px}
.muted{color:var(--muted)}
.lab{font-size:14px;color:var(--muted)}
.hero{display:flex;flex-direction:column;gap:6px;padding:30px 0 14px}
.hero .big{font-family:var(--num);font-size:56px;font-weight:600;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums lining-nums}
.hero .big.sm{font-size:28px}
.hero .sub{font-size:14px;color:var(--muted)}
.sec{font-size:13px;color:var(--muted);padding:10px 0 2px}
.rows{display:flex;flex-direction:column}
.grow-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px;align-items:baseline;padding:14px 0;border:none;border-bottom:none;background:none;text-align:left;width:100%;cursor:pointer;font:inherit;color:inherit}
.grow-row .n{font-size:16px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grow-row .v{font-family:var(--num);font-weight:600;font-size:16px;white-space:nowrap}
.grow-row .s{font-size:12px;color:var(--muted)}
.grow-row .s.r{text-align:right}
.pos{color:var(--pos)}.neg{color:var(--neg)}.zero{color:var(--muted)}

    S.groups[id]=Object.assign({id},JSON.parse(JSON.stringify(body))); (S.pendingG=S.pendingG||{})[id]=S.groups[id];
    closeSheet(); go(id); toast('Group started',true);

    if(S.pendingG) delete S.pendingG[id];
    if(!ok){ delete S.groups[id]; if(S.gid===id) go(null); }
  } else {
    const g=G(f.id), hasMoney=(S.exp[f.id]||[]).length>0||(S.pay[f.id]||[]).length>0;
    if(g && f.currency!==g.currency && hasMoney){
      const r=calc(f.convRate);
      if(!(r>0)){ err.textContent='Add the exchange rate to convert this group.'; return; }
      err.textContent='Converting...';

      return;

  }

async function convertGroup(g,cur,r,body){
  const from=g.currency, base='groups/'+g.id;
  for(const x of (S.exp[g.id]||[])){
    const y=Object.assign({},x); delete y.id;
    let nb, nr;
    if(x.currency===cur){ nb=x.amount; nr=1; }
    else if(x.currency===from){ nb=Math.round(x.amount*r); nr=r; }
    else { nr=(x.rate||1)*r; nb=Math.round(x.amount*nr); }
    const ids=Object.keys(x.shares||{});
    const parts=allocate(nb,ids.map(id=>x.shares[id]));
    const shares={}; ids.forEach((id,i)=>shares[id]=parts[i]);
    y.base=nb; y.rate=nr; y.shares=shares; y.exact=Object.assign({},x.exact||{}); y.weights=Object.assign({},x.weights||{}); y.notMine=Object.assign({},x.notMine||{}); y.updatedAt=Date.now();
    if(!(await write(()=>S.db.doc(base+'/expenses/'+x.id).set(y)))) return false;
  }
  for(const p of (S.pay[g.id]||[])){
    const y=Object.assign({},p); delete y.id; y.amount=Math.round(p.amount*r);
    if(!(await write(()=>S.db.doc(base+'/payments/'+p.id).set(y)))) return false;
  }
  const rates={}; Object.keys(g.rates||{}).forEach(k=>{ if(k!==cur) rates[k]=+(g.rates[k]*r).toFixed(6); }); rates[from]=+r.toFixed(6);
  const full=Object.assign({},g); delete full.id;
  Object.assign(full,body,{currency:cur,rates});
  return write(()=>S.db.doc(base).set(full));
}

// Live exchange rates: European Central Bank rates via frankfurter.dev, with open.er-api.com as a backup. Kept on the phone for 6 hours.
const RATE_KEY='kitty-rates';
async function liveRate(from,to){
  if(from===to) return {rate:1};
  let cache={}; try{ cache=JSON.parse(localStorage.getItem(RATE_KEY)||'{}'); }catch(e){}
  const k=from+'>'+to, c=cache[k]; if(c&&Date.now()-c.at<6*3600e3) return c;
  const get=async url=>{ const ctl=new AbortController(), tm=setTimeout(()=>ctl.abort(),5000); try{ const r=await fetch(url,{signal:ctl.signal}); return await r.json(); } finally{ clearTimeout(tm); } };
  const tries=[
    async()=>{ const j=await get('https://api.frankfurter.dev/v1/latest?base='+from+'&symbols='+to); const v=j&&j.rates&&j.rates[to]; if(!(v>0)) throw 0; return {rate:v,date:j.date}; },
    async()=>{ const j=await get('https://open.er-api.com/v6/latest/'+from); const v=j&&j.rates&&j.rates[to]; if(!(v>0)) throw 0; return {rate:v,date:j.time_last_update_unix?new Date(j.time_last_update_unix*1000).toISOString().slice(0,10):''}; }];
  for(const t of tries){ try{ const out=await t(); out.at=Date.now(); cache[k]=out; try{ localStorage.setItem(RATE_KEY,JSON.stringify(cache)); }catch(e){} return out; }catch(e){} }
  return c||null; // no signal: the last rate we had
}
const roundRate=v=>String(+(+v).toPrecision(5));
const rateDay=d=>{ if(!d) return ''; const x=pd(d); return ord(x.getDate())+' '+x.toLocaleDateString('en-GB',{month:'short'}); };
function fillLiveRate(kind){

  const expense=kind==='expense', g=expense?G(f.gid):(f.id&&G(f.id)); if(!g) return;
  const from=expense?f.currency:f.oldCurrency, to=expense?g.currency:f.currency, field=expense?'rate':'convRate', touched=expense?'rateTouched':'convTouched', noteId=expense?'rateNote':'gRateNote', inputId=expense?'e-rate':'g-rate';
  if(from===to||f[touched]) return;
  const setNote=t=>{ f[noteId]=t; const n=document.getElementById(noteId); if(n) n.textContent=t; };
  setNote("Getting today's rate...");
  liveRate(from,to).then(r=>{
    if(S.form!==f||f[touched]||(expense?f.currency:f.oldCurrency)!==from||(expense?g.currency:f.currency)!==to) return;
    if(!r){ setNote("Couldn't get the live rate - type it in"); return; }
    f[field]=roundRate(r.rate); const el=document.getElementById(inputId); if(el) el.value=f[field];

}

  let desc=(f.desc||'').trim(); desc=desc.charAt(0).toUpperCase()+desc.slice(1); const r=computeShares(f,g);
  if(!desc && f.cat!=='auto') desc=CATS[effCat(f).cat]||'';
  if(!desc){ goStep(2); f.errAt=performance.now(); err.textContent='Say what it was - pick a picture or name it.'; return; }
  if(!(r.total>0)){ goStep(1); f.errAt=performance.now(); err.textContent='Add an amount.'; return; }
  if(r.foreign && !(r.rate>0)){ goStep(1); f.errAt=performance.now(); err.textContent='Add the exchange rate.'; return; }
  if(!r.ids.length){ goStep(3); f.errAt=performance.now(); err.textContent='Pick at least one person to split with.'; return; }
  if(f.mode==='exact' && r.sum!==r.total){ err.textContent="The amounts don't add up to the total."; return; }
  if(f.mode==='shares' && r.parts.every(p=>p===0)){ err.textContent='Give someone at least one share.'; return; }
  const shares={}, exact={}, weights={};
  r.ids.forEach((id,i)=>{ shares[id]=r.baseParts[i]; if(f.mode==='exact') exact[id]=r.parts[i]; if(f.mode==='shares') weights[id]=Number(f.shares[id])||0; });
  const notMine={}; Object.keys(f.notMine||{}).forEach(k=>{ if(f.notMine[k] && shares[k]!=null) notMine[k]=true; });
  const catManual=f.cat!=='auto', ec=effCat(f);
  const body={desc:desc.slice(0,60),amount:r.total,currency:f.currency,rate:r.foreign?r.rate:1,base:r.base,paidBy:f.paidBy,date:f.date||today(),cat:ec.cat,meal:ec.meal||null,catManual,note:(f.note||'').slice(0,400),mode:f.mode,shares,exact,weights,photoId:f.photoId||null,notMine,createdAt:f.createdAt||Date.now(),createdBy:f.createdBy||S.uid||null,updatedAt:Date.now()};
  const id=f.id||rid('e');
  const saving=write(()=>S.db.doc('groups/'+g.id+'/expenses/'+id).set(body));
  closeSheet(); if(f.id) toast('Saved',true); else { const kind=ec.cat==='drinks'?'drinks':ec.cat==='meal'?'meal':'nom'; setTimeout(()=>popCat({drinks:'Cheers',meal:'Yum'}[kind]||'Nom nom',kind,g),260); }
  const upd={touchedAt:Date.now()}; if(r.foreign) upd.rates={[f.currency]:r.rate};
  saving.then(ok=>{ if(ok) write(()=>S.db.doc('groups/'+g.id).update(upd)); });
}

const LP={db:null,urls:{}};
function lpOpen(){ return LP.db||(LP.db=new Promise((res,rej)=>{ const r=indexedDB.open('kitty-photos',1); r.onupgradeneeded=()=>r.result.createObjectStore('p'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); })); }
async function lpPut(id,blob){ const db=await lpOpen(); return new Promise((res,rej)=>{ const t=db.transaction('p','readwrite'); t.objectStore('p').put(blob,id); t.oncomplete=res; t.onerror=()=>rej(t.error); }); }
async function lpGet(id){ const db=await lpOpen(); return new Promise(res=>{ const q=db.transaction('p').objectStore('p').get(id); q.onsuccess=()=>res(q.result||null); q.onerror=()=>res(null); }); }
async function lpDel(id){ try{ const db=await lpOpen(); db.transaction('p','readwrite').objectStore('p').delete(id); }catch(e){} }
const canPhoto=()=>!!(S.assets||window.indexedDB);

function dropPhoto(id){ if(!id) return; if(String(id).startsWith('local:')){ lpDel(id); return; } if(S.assets) S.assets.delete(id).catch(()=>{}); }
async function uploadPhoto(file){
  const f=S.form; if(!f||!canPhoto()||!file) return;
  f.uploading=true; renderSheet();
  let blob=file;
  try{
    const bmp=await createImageBitmap(file);
    const sc=Math.min(1,(S.assets?1600:1280)/Math.max(bmp.width,bmp.height));
    const c=document.createElement('canvas'); c.width=Math.round(bmp.width*sc); c.height=Math.round(bmp.height*sc);
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    blob=await new Promise(res=>c.toBlob(b=>res(b||file),'image/jpeg',S.assets?0.82:0.72));
  }catch(e){ blob=file; }
  try{ if(S.assets){ const a=await S.assets.upload(blob); if(S.form===f){ f.photoId=a.id; } }
       else { const id='local:'+rid('p'); await lpPut(id,blob); if(S.form===f){ f.photoId=id; } } }
  catch(e){ toast(e&&e.code==='quota_exceeded'?'No room for more photos':"Couldn't upload that photo"); }
  if(S.form===f){ f.uploading=false; renderSheet(); }
}

async function setNotMine(x,mid,val){

async function removeFromExpense(x,mid){
  const g=G(S.gid); const ids=Object.keys(x.shares||{}).filter(k=>k!==mid);
  if(!ids.length){ toast("They're the only one on it - delete it instead"); return; }
  const body=Object.assign({},x); delete body.id;
  let parts;
  if(x.mode==='exact'){ toast('This one has set amounts - edit it to change them'); newExpenseForm(g.id,x); S.form.inc[mid]=false; delete S.form.notMine[mid]; renderSheet(); return; }
  if(x.mode==='shares'){ parts=allocate(x.base,ids.map(id=>(x.weights&&x.weights[id])||0)); }
  else parts=allocate(x.base,ids.map(()=>1));
  const shares={}; ids.forEach((id,i)=>shares[id]=parts[i]);
  body.shares=shares; body.notMine=Object.assign({},x.notMine||{}); delete body.notMine[mid];
  if(x.mode==='shares'){ body.weights=Object.assign({},x.weights||{}); delete body.weights[mid]; }
  body.exact={}; body.updatedAt=Date.now();
  toast('Updated'); renderSheet();
  write(()=>S.db.doc('groups/'+g.id+'/expenses/'+x.id).set(body)).then(ok=>{ if(!ok&&S.sheet) renderSheet(); });
}

(()=>{

  const skip=b=>{ b._skip=true; setTimeout(()=>b._skip=false,500); };
  const turn=(b,fn)=>{ b.querySelector('svg').animate([{transform:'scaleX(1)'},{transform:'scaleX(0)',offset:.5},{transform:'scaleX(1)'}],{duration:320,easing:'ease-in-out'}); setTimeout(fn,160); };

  const frame=()=>{ if(!c) return; const now=performance.now(), t=now-t0, e=Math.min(1,t/900), P=c.P, o=c.o; p=1-(1-e)*(1-e);
    const u=Math.min(1,t/T), S=Math.pow(c.R,Math.pow(u,1.7)), r=c.r0*S, y0=c.cy-c.rise*p, tx=innerWidth/2-c.cx, ty=innerHeight/2-y0, d=Math.hypot(tx,ty)||1, w=Math.min(1,Math.max(0,(r-c.r0)/d)), x=c.cx+tx*w, y=y0+ty*w;

    case 'toggleSplit': S.form.showSplit=!S.form.showSplit; if(!S.form.showSplit) S.form.mode='equal'; renderSheet(); if(S.form.step!==3) goStep(3); break;
    case 'toggleNote': S.form.showNote=!S.form.showNote; renderSheet(); { const n=document.getElementById('e-note'); if(n) n.focus(); } break;
    case 'delExp': { const f=S.form; const x=(S.exp[f.gid]||[]).find(e=>e.id===f.id); if(x) softDelete('groups/'+f.gid+'/expenses/'+x.id,x,'"'+x.desc+'" deleted',x.photoId); break; }
    case 'exp': openSheet('detail',{id:t.dataset.e}); break;
    case 'editExp': { const x=(S.exp[g.id]||[]).find(e=>e.id===S.sheet.data.id); if(x) newExpenseForm(g.id,x); break; }
    case 'nmToggle': { const x=(S.exp[g.id]||[]).find(e=>e.id===S.sheet.data.id); const me=myMid(g); if(x) setNotMine(x,me,!(x.notMine&&x.notMine[me])).then(ok=>{ if(ok){ toast('Updated'); renderSheet(); } }); break; }
    case 'nmKeep': { const x=(S.exp[g.id]||[]).find(e=>e.id===S.sheet.data.id); if(x) setNotMine(x,t.dataset.m,false).then(ok=>{ if(ok) renderSheet(); }); break; }
    case 'nmRemove': { const x=(S.exp[g.id]||[]).find(e=>e.id===S.sheet.data.id); if(x) removeFromExpense(x,t.dataset.m); break; }
    case 'markPaid': { const c=calcGroup(g), tr=c.transfers[Number(t.dataset.i)]; if(tr){ S.settleAsk=tr.from+'>'+tr.to; renderSheet(); } break; }
    case 'payNo': S.settleAsk=null; renderSheet(); break;
    case 'payYes': { const c=calcGroup(g), tr=c.transfers[Number(t.dataset.i)]; if(!tr) break; S.settleAsk=null; const row=t.closest('.xfer'); if(row) row.classList.add('going');
      foldAway(row,()=>addPayment(g,tr.from,tr.to,tr.amount,true)); break; }
    case 'recordPay': openSheet('pay',{}); break;
    case 'savePay': savePay(); break;
    case 'delPay': { const p=(S.pay[g.id]||[]).find(x=>x.id===t.dataset.p); if(!p) break; const row=t.closest('.orow'); foldAway(row,()=>softDelete('groups/'+g.id+'/payments/'+p.id,p,'Payment removed',null,true)); break; }
    case 'undo': { const u=S.undo; S.undo=null; hideToast('up'); if(u){ clearTimeout(u.timer); { const m=/\/expenses\/([^/]+)$/.exec(u.path); if(m) S.newAt[m[1]]=performance.now(); } write(()=>S.db.doc(u.path).set(u.body)).then(ok=>{ if(ok) toast('Back again',true); }); } break; }
    case 'search': openSheet('search',{q:''}); break;
    case 'srOpen': { closeSheet(); go(t.dataset.g); setTimeout(()=>openSheet('detail',{id:t.dataset.e}),330); break; }
    case 'partyClose': endParty(); break;
    case 'calOpen': if(S.form.showCal) calClose(); else { S.form.showCal=true; S.form.calIn=true; S.form.calMonth=(S.form.startDate||today()).slice(0,7); renderSheet(); } break;
    case 'calNav': { const [y,mo]=S.form.calMonth.split('-').map(Number); const d=new Date(y,mo-1+Number(t.dataset.d),1); S.form.calMonth=isoOf(d).slice(0,7); renderSheet(); break; }
    case 'calDay': { const f=S.form, d=t.dataset.d; if(!f.startDate||f.endDate){ f.startDate=d; f.endDate=''; } else if(d<f.startDate){ f.startDate=d; } else { f.endDate=d; } renderSheet(); break; }
    case 'calClear': S.form.startDate=''; S.form.endDate=''; renderSheet(); break;
    case 'pet': { if(t._skip){ t._skip=false; break; } t.classList.remove('pet'); void t.offsetWidth; t.classList.add('pet'); clearTimeout(t._p); t._p=setTimeout(()=>t.classList.remove('pet'),900); break; }
    case 'working': S.showWorking=!S.showWorking; render(); break;
    case 'payInfo': openSheet('payInfo',{mid:t.dataset.m}); break;
    case 'copyPay': { const m=mem(g,S.sheet.data.mid); if(m) copyText(m.pay||''); break; }
    case 'copyLink': copyText(inviteLink(g)); break;
    case 'confirmYes': { const fn=S.confirm&&S.confirm.fn; if(S.confirm) S.confirm.done=true; closeSheet(); if(fn) fn(); break; }
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.search){ S.sheet.data.q=t.value; const r=document.getElementById('s-res'); if(r){ const h=searchList(t.value); sheetFlip(()=>{ r.innerHTML=h; }); } return; }
  if(!S.form) return;
  if(t.dataset.f){ const was=S.form[t.dataset.f]; if(t.dataset.f==='currency'&&was===t.value) return; S.form[t.dataset.f]=t.value; if(t.dataset.f==='rate'){ S.form.rateTouched=true; S.form.rateNote=''; const n=document.getElementById('rateNote'); if(n) n.textContent=''; } if(t.dataset.f==='convRate'){ S.form.convTouched=true; S.form.gRateNote=''; const n=document.getElementById('gRateNote'); if(n) n.textContent=''; } if(t.dataset.f==='currency' && S.sheet.kind==='expense'){ const g=G(S.form.gid); S.form.rate=t.value!==g.currency?rateFor(g,t.value):''; S.form.rateTouched=false; S.form.rateNote=''; renderSheet(); fillLiveRate('expense'); return; } if(t.dataset.f==='currency'&&S.sheet.kind==='group'){ const g=S.form.id&&G(S.form.id); if(g&&t.value!==g.currency){ const r=g.rates&&g.rates[t.value]; S.form.convRate=r?String(+(1/r).toFixed(6)):''; } S.form.convTouched=false; S.form.gRateNote=''; renderSheet(); fillLiveRate('group'); return; } if(t.dataset.f==='desc' && S.sheet.kind==='expense'){ clearTimeout(applyPrev._t); applyPrev._t=setTimeout(applyPrev,250); } updatePreview(); }
  else if(t.dataset.ex){ S.form.touchedSplit=true; S.form.exact[t.dataset.ex]=t.value; updatePreview(); }
  else if(t.dataset.mnew!=null){ S.form.newName=t.value; }
  else if(t.dataset.pay!=null){ S.form.members[Number(t.dataset.pay)].pay=t.value; }
});
document.addEventListener('change',e=>{ const t=e.target; if((t.id==='e-photo'||t.id==='e-photo-m') && t.files && t.files[0]) uploadPhoto(t.files[0]); if(t.tagName==='SELECT' && t.dataset.f && S.form){ S.form[t.dataset.f]=t.value; } if(t.id==='e-date' && S.form){ S.form.date=t.value||today(); renderSheet(); } });
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && S.sheet) closeSheet(); });
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target.id==='my-name'){ e.preventDefault(); saveName(); } });
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target.id==='m-new'){ e.preventDefault(); const ed=S.form.editIdx!=null; memCommit(!ed); renderSheet(); if(!ed) focusNew(); } if(e.key==='Enter'&&e.target.id==='g-title'&&S.form&&!S.form.id){ e.preventDefault(); gNext(); } });
document.addEventListener('keydown',e=>{ const t=e.target; if((e.key==='Enter'||e.key===' ')&&t.matches&&t.matches('span[role=button][data-a]')){ e.preventDefault(); t.click(); } });

boot();
})();
</script>
<script>
if('serviceWorker' in navigator){
  let first=!navigator.serviceWorker.controller;
  let shown=performance.now();
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{ try{ r.update(); }catch(e){}
    document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'){ shown=performance.now(); try{ r.update(); }catch(e){} } });
  }).catch(()=>{});
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(first){ first=false; return; }
    if(performance.now()-shown<4000 && !document.querySelector('#sheet .pn')){ location.reload(); return; }
    if(document.getElementById('kupd')) return;
    const b=document.createElement('button'); b.id='kupd'; b.textContent='New version of Kitty - tap to update';
    b.style.cssText='position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 12px);z-index:60;background:#111;color:#F7F6F3;border:none;border-radius:2px;padding:11px 16px;font:inherit;font-size:14px;white-space:nowrap';
    b.onclick=()=>location.reload(); document.body.appendChild(b);
  });
}
</script>
